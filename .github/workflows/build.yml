
name: Build Grocery Master APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip GroceryMaster-Android-v1.1-github-build.zip -d project
          ROOT=$(find project -name settings.gradle.kts -printf '%h\n' | head -n 1)
          test -n "$ROOT"
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          APP_GRADLE=$(find . \( -path '*/app/build.gradle.kts' -o -path '*/app/build.gradle' \) | head -n 1)
          test -n "$APP_GRADLE"

          if [[ "$APP_GRADLE" == *.kts ]]; then
            cat >> "$APP_GRADLE" <<'GRADLE'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_21
                  targetCompatibility = JavaVersion.VERSION_21
              }
          }
          GRADLE
          else
            cat >> "$APP_GRADLE" <<'GRADLE'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
          }
          GRADLE
          fi

          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GroceryMaster-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
